name: Reusable Buildah Build & Push Image

on:
  workflow_call:
    inputs:
      image_name:
        description: 'Image name (without ghcr repo prefix), e.g. oldowan-web'
        required: true
        type: string
      dockerfile:
        description: 'Path to the Dockerfile'
        required: true
        type: string
      context:
        description: 'Build context directory'
        required: true
        type: string

jobs:
  image-build-and-push:
    runs-on: ars-oldowan
    container:
      image: ghcr.io/bennettxxbb/oldowan/oldowan-devops-buildah:latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # 凭证通过 buildah push 的 --creds 显式传入，不再写 config.json
      - name: Build and Push ${{ inputs.image_name }} with Buildah
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_PASSWORD: ${{ secrets.GHCR_TOKEN }}
        run: |
          # GITHUB_REPOSITORY 含大写（Oldowan），docker 仓库名必须全小写
          IMAGE="ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')/${{ inputs.image_name }}:latest"
          REPO_LOWER="${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]'

          # 无特权容器内 overlayfs 不可用，显式指定 vfs 存储驱动
          # --isolation chroot：无特权 pod 里 /sys/fs/cgroup 只读，
          # crun 创建 cgroup 会失败；chroot 隔离跳过 OCI runtime，
          # RUN 直接在容器根文件系统执行（网络共用 pod，apt/npm 可联网）
          buildah bud \
            --storage-driver vfs \
            --isolation chroot \
            --label "org.opencontainers.image.source https://github.com/${GITHUB_REPOSITORY}" \
            -f ${{ inputs.dockerfile }} \
            -t "${IMAGE}" \
            ${{ inputs.context }}
          buildah push --tls-verify=true \
            --storage-driver vfs \
            --format oci \
            --creds "${GHCR_USERNAME}:${GHCR_PASSWORD}" \
            "${IMAGE}" \
            docker://"${IMAGE}"

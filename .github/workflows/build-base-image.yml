name: Build and Push Devops Base Image

on:
  workflow_dispatch:

jobs:
  build-base-image:
    if: github.ref == 'refs/heads/main'
    runs-on: ars-oldowan
    container:
      image: ghcr.io/bennettxxbb/oldowan/oldowan-devops-buildah:latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # 凭证通过 buildah push 的 --creds 显式传入，不再写 config.json
      - name: Build and Push Devops Base Image with Buildah
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_PASSWORD: ${{ secrets.GHCR_TOKEN }}
        run: |
          # GITHUB_REPOSITORY 含大写（Oldowan），docker 仓库名必须全小写
          IMAGE="ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')/oldowan-devops-base:latest"

          # 无特权容器内 overlayfs 不可用，显式指定 vfs 存储驱动
          # --isolation chroot：无特权 pod 里 /sys/fs/cgroup 只读，
          # crun 创建 cgroup 会失败；chroot 隔离跳过 OCI runtime，
          # RUN 直接在容器根文件系统执行（网络共用 pod，apt 可联网）
          buildah bud \
            --storage-driver vfs \
            --isolation chroot \
            -f devops/image/base/Dockerfile \
            -t "${IMAGE}" \
            devops/image/base
          buildah push --tls-verify=true \
            --storage-driver vfs \
            --creds "${GHCR_USERNAME}:${GHCR_PASSWORD}" \
            "${IMAGE}" \
            docker://"${IMAGE}"

name: Build and Push Docker Image

on:
  workflow_dispatch:

jobs:
  buildah-build:
    if: github.ref == 'refs/heads/main'
    runs-on: ars-oldowan

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Buildah 是标准发行版软件包，可以直接装进 runner 镜像
      - name: Install Buildah
        run: |
          SUDO=""
          id -u | grep -q '^0$' || SUDO="sudo"

          if command -v apt >/dev/null; then
            ${SUDO} apt update -qq && ${SUDO} apt install -y -qq buildah
          elif command -v dnf >/dev/null; then
            ${SUDO} dnf install -y buildah
          elif command -v yum >/dev/null; then
            ${SUDO} yum install -y buildah
          else
            echo "::error::No supported package manager found (apt/dnf/yum)"
            exit 1
          fi
          buildah --version

      - name: Setup Registry Auth
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/.docker"
          echo "{\"auths\":{\"ghcr.io\":{\"username\":\"${GHCR_USERNAME}\",\"password\":\"${GHCR_PASSWORD}\"}}}" > "${GITHUB_WORKSPACE}/.docker/config.json"

      - name: Build and Push with Buildah
        env:
          REGISTRY_AUTH_FILE: ${{ github.workspace }}/.docker/config.json
        run: |
          # GITHUB_REPOSITORY 含大写（Oldowan），docker 仓库名必须全小写
          IMAGE="ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')/oldowan-web:latest"

          # runner 非 root 时用 sudo 以 root 跑 buildah：rootless 模式需要
          # /etc/subuid、/etc/subgid 的 userns 映射来解包镜像层，k8s 容器里
          # 通常没配置，会报 "potentially insufficient UIDs or GIDs"
          SUDO=""
          id -u | grep -q '^0$' || SUDO="sudo --preserve-env=REGISTRY_AUTH_FILE"

          # 无特权容器内 overlayfs 不可用，显式指定 vfs 存储驱动
          ${SUDO} buildah bud \
            --storage-driver vfs \
            -f angular/Dockerfile \
            -t "${IMAGE}" \
            angular
          ${SUDO} buildah push --tls-verify=true \
            --storage-driver vfs \
            "${IMAGE}" \
            docker://"${IMAGE}"
